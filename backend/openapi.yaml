  # ── Solar ─────────────────────────────────────────────────────────────────────

  /api/solar/forecast:
    get:
      summary: Estimate solar energy production and revenue
      description: |
        Returns per-period (daily/weekly/monthly/yearly) kWh production estimates
        and revenue projections for a given panel setup. All calculations are
        server-side; no external data sources are used.
      operationId: getSolarForecast
      tags: [solar]
      parameters:
        - name: capacityKw
          in: query
          required: true
          description: Total panel capacity in kilowatts (e.g. 5)
          schema: { type: number, exclusiveMinimum: 0, maximum: 10000 }
        - name: peakSunHours
          in: query
          required: true
          description: Average daily peak sun hours for the location
          schema: { type: number, exclusiveMinimum: 0, maximum: 24 }
        - name: efficiency
          in: query
          description: Panel efficiency 0–1 (default 0.20)
          schema: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.20 }
        - name: panelAgeYears
          in: query
          description: Age of panels in years for degradation calculation (default 0)
          schema: { type: number, minimum: 0, default: 0 }
        - name: ratePerKwh
          in: query
          description: Local electricity rate in XLM/kWh (default 0.12)
          schema: { type: number, minimum: 0, default: 0.12 }
      responses:
        "200":
          description: Solar production forecast
          content:
            application/json:
              schema:
                type: object
                required: [panelCapacityKw, peakSunHours, efficiency, panelAgeYears, effectiveDegradation, dailyKwh, forecast, assumptions]
                properties:
                  panelCapacityKw: { type: number }
                  peakSunHours: { type: number }
                  efficiency: { type: number }
                  panelAgeYears: { type: number }
                  effectiveDegradation: { type: number }
                  dailyKwh: { type: number }
                  forecast:
                    type: array
                    items:
                      type: object
                      required: [period, days, estimatedKwh, estimatedRevenue]
                      properties:
                        period: { type: string }
                        days: { type: integer }
                        estimatedKwh: { type: number }
                        estimatedRevenue: { type: number }
                  assumptions:
                    type: object
                    properties:
                      systemLoss: { type: number }
                      degradationRatePerYear: { type: number }
                      ratePerKwh: { type: number }
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/solar/irradiance-zones:
    get:
      summary: Reference peak sun hours by climate zone
      description: |
        Returns a static list of common climate zones with their reference peak
        sun-hour values. Useful for populating dropdowns on the frontend.
      operationId: getSolarIrradianceZones
      tags: [solar]
      responses:
        "200":
          description: Irradiance zone list
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items:
                      type: object
                      required: [name, peakSunHours]
                      properties:
                        name: { type: string }
                        peakSunHours: { type: number }

  # ── Work Orders (technician portal, #991) ────────────────────────────────────

  /api/work-orders:
    post:
      summary: Create a work order
      description: |
        Creates an installation, maintenance, repair, or inspection work order.
        Optionally assigns it to a technician immediately.
      operationId: createWorkOrder
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [installation, maintenance, repair, inspection]
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                  default: normal
                meterId: { type: string }
                customerName: { type: string }
                address: { type: string }
                description: { type: string }
                technicianId: { type: string }
                scheduledFor: { type: string, format: date-time }
      responses:
        "201":
          description: Work order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/work-orders/assigned/{techId}:
    get:
      summary: List a technician's assigned tasks
      description: Returns all work orders assigned to the given technician.
      operationId: getAssignedWorkOrders
      parameters:
        - name: techId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          description: Filter by work order status
          schema:
            type: string
            enum: [pending, assigned, in_progress, completed, cancelled]
      responses:
        "200":
          description: Assigned work orders
          content:
            application/json:
              schema:
                type: object
                required: [workOrders, count]
                properties:
                  workOrders:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkOrder"
                  count: { type: integer }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/work-orders/{id}/complete:
    patch:
      summary: Mark a work order complete
      description: |
        Marks the work order as completed, records the completion timestamp and
        optional notes, and stores any verification photos already uploaded.
      operationId: completeWorkOrder
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                completionNotes: { type: string }
                photos:
                  type: array
                  items: { type: string, format: uri }
      responses:
        "200":
          description: Work order completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/work-orders/{id}/photos:
    post:
      summary: Upload installation verification photos
      description: |
        Attaches one or more verification photos to a work order. Photos are
        submitted as URLs (e.g. after direct upload to object storage).
      operationId: uploadWorkOrderPhotos
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/WorkOrderPhoto"
      responses:
        "201":
          description: Photos attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Surveys (#994) ───────────────────────────────────────────────────────────

  /api/surveys:
    post:
      summary: Create a customer satisfaction survey
      description: |
        Creates a survey and, when `send` is true, queues the survey email to
        the customer. Surveys can also be created automatically after payments
        or support interactions.
      operationId: createSurvey
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [post_payment, post_support, periodic]
                meterId: { type: string }
                customerEmail: { type: string, format: email }
                subject: { type: string }
                send:
                  type: boolean
                  default: false
                questions:
                  type: array
                  items:
                    type: object
                    required: [id, text]
                    properties:
                      id: { type: string }
                      text: { type: string }
                      kind:
                        type: string
                        enum: [nps, rating, free_text]
      responses:
        "201":
          description: Survey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/surveys/{id}/responses:
    post:
      summary: Record a survey response
      description: Records a customer's answers, including an optional NPS score.
      operationId: createSurveyResponse
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                npsScore:
                  type: integer
                  minimum: 0
                  maximum: 10
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment: { type: string }
                answers:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/surveys/analytics:
    get:
      summary: Satisfaction and NPS analytics
      description: |
        Returns aggregated satisfaction metrics, including the Net Promoter
        Score, promoter/passive/detractor counts, and an optional trend series.
      operationId: getSurveyAnalytics
      security:
        - AdminKey: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: type
          in: query
          schema:
            type: string
            enum: [post_payment, post_support, periodic]
      responses:
        "200":
          description: Survey analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpsAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Seasonal pricing (#992) ──────────────────────────────────────────────────

  /api/pricing/season:
    get:
      summary: Current seasonal rate
      description: |
        Returns the seasonal rate currently in effect based on the current date,
        along with the effective price after applying the multiplier.
      operationId: getCurrentSeason
      responses:
        "200":
          description: Current season and rate
          content:
            application/json:
              schema:
                type: object
                required: [current, baseRate, effectiveRate]
                properties:
                  current:
                    $ref: "#/components/schemas/SeasonalRate"
                  baseRate:
                    type: number
                    description: Base energy rate before the seasonal multiplier
                  effectiveRate:
                    type: number
                    description: Base rate multiplied by the current seasonal multiplier
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pricing/season/history:
    get:
      summary: Historical seasonal rate comparison
      description: |
        Returns the seasonal rates that have applied over time so customers can
        compare current pricing against previous seasons.
      operationId: getSeasonalRateHistory
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Seasonal rate history
          content:
            application/json:
              schema:
                type: object
                required: [history, count]
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeasonalRateHistoryEntry"
                  count: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/weather/energy-forecast:
    get:
      summary: Forecast hourly energy production and consumption
      description: |
        Returns up to 48 hourly forecasts using a seasonal regression trained
        on the preceding 90 days of meter usage and/or registered solar-panel
        telemetry. OpenWeather hourly conditions are used to adjust estimates.
        Accuracy is measured on held-out history and is null when unavailable.
      operationId: getHourlyEnergyForecast
      tags: [weather]
      parameters:
        - name: meterId
          in: query
          description: Meter whose historical milli-kWh usage should be forecast.
          schema: { type: string, maxLength: 64 }
        - name: deviceId
          in: query
          description: Registered solar_panel device whose production should be forecast.
          schema: { type: string, maxLength: 100 }
        - name: lat
          in: query
          description: Latitude; required unless supplied by the registered solar device.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          description: Longitude; required unless supplied by the registered solar device.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: hours
          in: query
          description: Forecast horizon in whole hours (default 48).
          schema: { type: integer, minimum: 1, maximum: 48, default: 48 }
      responses:
        "200":
          description: Hourly forecast and per-model holdout accuracy.
          content:
            application/json:
              schema:
                type: object
                required: [horizonHours, generatedAt, location, weatherStale, models, forecast]
                properties:
                  meterId: { type: [string, "null"] }
                  deviceId: { type: [string, "null"] }
                  horizonHours: { type: integer, minimum: 1, maximum: 48 }
                  generatedAt: { type: string, format: date-time }
                  weatherStale: { type: boolean }
                  models:
                    type: object
                    properties:
                      production: { $ref: "#/components/schemas/EnergyForecastModel" }
                      consumption: { $ref: "#/components/schemas/EnergyForecastModel" }
                  forecast:
                    type: array
                    items:
                      type: object
                      required: [timestamp, productionKwh, consumptionKwh, weather]
                      properties:
                        timestamp: { type: string, format: date-time }
                        productionKwh: { type: [number, "null"] }
                        consumptionKwh: { type: [number, "null"] }
                        weather:
                          type: object
                          properties:
                            temperatureC: { type: number }
                            cloudCoverPct: { type: number }
                            precipitationProbability: { type: number }
                            condition: { type: string }
                            productionFactor: { type: number }
                            consumptionTemperatureFactor: { type: number }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Weather provider did not return a usable 48-hour forecast.
