openapi: "3.1.0"

info:
  title: SolarGrid Backend API
  description: |
    REST API for the Stellar SolarGrid PAYG solar energy platform.

    Provides access to smart meter data, payment processing, energy statistics,
    provider revenue, webhook management, and admin utilities.  Most write
    endpoints and admin endpoints require the `X-Admin-Key` header.
  version: "0.1.0"
  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Local development server

# ── Security ──────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: >
        Admin API key set via the `ADMIN_API_KEY` environment variable.
        Required for all write and admin-only endpoints.

  schemas:
    # ── Common ────────────────────────────────────────────────────────────────

    EnergyForecastModel:
      type: [object, "null"]
      properties:
        algorithm: { type: string, example: seasonal-ridge }
        trainingSamples: { type: integer }
        accuracyPct: { type: [number, "null"], minimum: 0, maximum: 100 }
        trainedAt: { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

    ExportCertificate:
      type: object
      description: Renewable energy export certificate (#871)
      required: [id, meterId, producer, owner, energyWh, energyKwh, periodStart, periodEnd, issuedAt, issuer, readingHash, retiredAt, status]
      properties:
        id: { type: string }
        meterId: { type: string }
        producer: { type: string, description: Meter owner at issuance }
        owner: { type: string, description: Current holder }
        energyWh: { type: string, description: Exported watt-hours (decimal string) }
        energyKwh: { type: number }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time }
        issuer: { type: string }
        readingHash: { type: string, description: SHA-256 hex of the canonical reading payload }
        retiredAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, retired] }

    TxHash:
      type: object
      required: [hash]
      properties:
        hash:
          type: string
          description: Stellar transaction hash

    # ── Audit ─────────────────────────────────────────────────────────────────

    AuditEntry:
      type: object
      description: A structured audit log entry for an admin-invoked action. Closes #744.
      required: [timestamp, method, path, ip, keyHint]
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the action
        method:
          type: string
          description: HTTP method (e.g. POST)
        path:
          type: string
          description: API route path (e.g. /api/allowlist)
        params:
          description: Request body at time of action (secrets excluded)
        ip:
          type: string
          description: Requester IP address
        keyHint:
          type: string
          description: Last 4 characters of the admin key used (e.g. ...ab12)

    # ── Meter ─────────────────────────────────────────────────────────────────

    ForecastConfidenceBand:
      type: object
      description: Confidence interval for a forecasted value (#982)
      required: [low, high]
      properties:
        low: { type: number, description: Lower bound of the prediction interval }
        high: { type: number, description: Upper bound of the prediction interval }

    ForecastDay:
      type: object
      description: A single day of the 7-day usage and solar generation forecast (#982)
      required: [date, predictedUsageKwh, predictedSolarKwh, usageConfidence, solarConfidence]
      properties:
        date: { type: string, format: date }
        predictedUsageKwh: { type: number, description: Predicted energy consumption in kWh }
        predictedSolarKwh: { type: number, description: Predicted solar generation in kWh }
        usageConfidence:
          $ref: "#/components/schemas/ForecastConfidenceBand"
        solarConfidence:
          $ref: "#/components/schemas/ForecastConfidenceBand"
        temperatureC: { type: number, description: Forecast mean temperature in Celsius }
        sunlightHours: { type: number, description: Forecast sunlight hours }
        cloudCoverPct: { type: number, description: Forecast cloud cover percentage }
        condition: { type: string, description: Weather condition summary }

    CreditAlert:
      type: object
      description: Alert raised when the meter is predicted to run out of credit (#982)
      required: [willRunOut, daysUntilEmpty]
      properties:
        willRunOut: { type: boolean }
        daysUntilEmpty: { type: [integer, "null"], description: Days until predicted credit exhaustion }
        predictedEmptyDate: { type: [string, "null"], format: date }
        message: { type: string }

    MeterForecast:
      type: object
      description: 7-day weather-based usage and solar generation forecast (#982)
      required: [meterId, generatedAt, horizonDays, days, creditAlert]
      properties:
        meterId: { type: string }
        generatedAt: { type: string, format: date-time }
        horizonDays: { type: integer, default: 7 }
        location:
          type: object
          properties:
            lat: { type: number }
            lon: { type: number }
        days:
          type: array
          items:
            $ref: "#/components/schemas/ForecastDay"
        creditAlert:
          $ref: "#/components/schemas/CreditAlert"
        model:
          $ref: "#/components/schemas/EnergyForecastModel"

    ApplianceUsage:
      type: object
      description: Per-appliance energy usage breakdown entry (#983)
      required: [appliance, usageKwh, sharePct]
      properties:
        appliance: { type: string, description: Identified appliance name }
        usageKwh: { type: number, description: Energy consumed in kWh }
        sharePct: { type: number, description: Percentage of total consumption }
        trend:
          type: string
          enum: [increasing, decreasing, stable]
          description: Usage trend relative to the previous period
        recommendation: { type: string, description: Energy-saving recommendation }

    ApplianceBreakdown:
      type: object
      description: Appliance-level energy monitoring breakdown (#983)
      required: [meterId, generatedAt, totalUsageKwh, appliances]
      properties:
        meterId: { type: string }
        generatedAt: { type: string, format: date-time }
        totalUsageKwh: { type: number }
        appliances:
          type: array
          items:
            $ref: "#/components/schemas/ApplianceUsage"

    DiagnosticLog:
      type: object
      description: Result of a remote meter diagnostic command (#993)
      required: [id, meterId, command, status, startedAt]
      properties:
        id: { type: integer }
        meterId: { type: string }
        command:
          type: string
          enum: [reboot, self_test, check_connectivity]
        status:
          type: string
          enum: [pending, running, success, failed]
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        result: { type: [object, "null"], description: Raw diagnostic result payload }
        suggestedFix: { type: [string, "null"], description: Suggested remediation for common issue patterns }

    MeterBalance:
      type: object
      required: [meter_id, balance, units_used, active]
      properties:
        meter_id:
          type: string
        balance:
          type: integer
          description: Current balance in stroops
        units_used:
          type: integer
          description: Total energy units consumed
        active:
          type: boolean

    UsageEvent:
      type: object
      properties:
        id:
          type: integer
        meter_id:
          type: string
        units:
          type: integer
        cost:
          type: string
        received_at:
          type: string
          format: date-time
        source_topic:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, submitted, failed]
        attempt_count:
          type: integer
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        on_chain_tx_hash:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true

    # ── Stats ─────────────────────────────────────────────────────────────────

    ContractStats:
      type: object
      required: [totalMeters, activeMeters, totalUnits, totalRevenue]
      properties:
        totalMeters:
          type: integer
          description: Total registered meters on-chain
        activeMeters:
          type: integer
          description: Meters currently active (paid and within validity period)
        totalUnits:
          type: integer
          description: Total energy units consumed across all meters
        totalRevenue:
          type: integer
          description: Provider total revenue in stroops

    MetricsSummary:
      type: object
      required: [mqttMessages, contractCalls, activeMeters, paymentVolumeXlm]
      properties:
        mqttMessages:
          type: number
          description: Total MQTT messages received since process start
        contractCalls:
          type: number
          description: Total Soroban contract invocations since process start
        activeMeters:
          type: number
          description: Current active meter gauge value
        paymentVolumeXlm:
          type: number
          description: Cumulative payment volume in XLM

    # ── Provider ──────────────────────────────────────────────────────────────

    ProviderSummary:
      type: object
      required: [provider, totalRevenue, totalMeters, activeMeters, totalUnitsUsed]
      properties:
        provider:
          type: string
          nullable: true
          description: Admin address (ADMIN_ADDRESS env var)
        totalRevenue:
          type: integer
          description: Provider revenue in stroops
        totalMeters:
          type: integer
        activeMeters:
          type: integer
        totalUnitsUsed:
          type: integer

    # ── Dead-letter ───────────────────────────────────────────────────────────

    MeterNote:
      type: object
      required: [id, meter_id, text, created_at]
      properties:
        id:
          type: integer
        meter_id:
          type: string
        author_ip:
          type: string
          nullable: true
          description: IP address of the admin who created the note
        text:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time

    MeterNoteList:
      type: object
      required: [notes, total, page, pageSize, hasMore]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/MeterNote"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    DeadLetterList:
      type: object
      required: [total, limit, offset, events]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        events:
          type: array
          items:
            $ref: "#/components/schemas/UsageEvent"

    # ── Webhook ───────────────────────────────────────────────────────────────

    WebhookRecord:
      type: object
      required: [id, provider_id, url, created_at, failure_count]
      properties:
        id:
          type: integer
        provider_id:
          type: string
        url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
        failure_count:
          type: integer
          description: Total failed delivery attempts

    WebhookDelivery:
      type: object
      required: [id, webhook_id, attempted_at, status]
      properties:
        id:
          type: integer
        webhook_id:
          type: integer
        attempted_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, failed]
        http_status:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true

    # ── Maintenance ───────────────────────────────────────────────────────────

    MaintenanceWindow:
      type: object
      description: A scheduled maintenance window (#979)
      required: [id, title, description, scheduledStart, scheduledEnd, status, affectedMeters, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
        affectedMeters:
          type: array
          description: Meter ids impacted by this maintenance window
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    CreateMaintenanceWindowRequest:
      type: object
      required: [title, scheduledStart, scheduledEnd]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        affectedMeters:
          type: array
          description: Meter ids impacted by this maintenance window
          items:
            type: string

    # ── Collaborator ──────────────────────────────────────────────────────────

    CollaboratorShare:
      type: object
      required: [address, basisPoints]
      properties:
        address:
          type: string
          description: Stellar account address
        basisPoints:
          type: integer
          description: Revenue share in basis points (100 = 1%)

    # ── Technician portal (#991) ──────────────────────────────────────────────

    Technician:
      type: object
      description: A field technician who can be assigned work orders.
      required: [id, name, email, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
          description: Service region the technician is responsible for
        skills:
          type: array
          items: { type: string }
          description: e.g. installation, maintenance, meter_repair
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WorkOrder:
      type: object
      description: An installation or maintenance job assigned to a technician.
      required: [id, type, status, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [installation, maintenance, repair, inspection]
        status:
          type: string
          enum: [pending, assigned, in_progress, completed, cancelled]
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal
        meterId:
          type: string
          nullable: true
          description: Meter the work order relates to
        customerName:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        technicianId:
          type: string
          nullable: true
        scheduledFor:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        completionNotes:
          type: string
          nullable: true
        photos:
          type: array
          items: { type: string, format: uri }
          description: URLs of uploaded verification photos
        createdAt:
          type: string
          format: date-time

    WorkOrderPhoto:
      type: object
      description: A photo uploaded as installation verification evidence.
      required: [url]
      properties:
        url:
          type: string
          format: uri
        caption:
          type: string
          nullable: true
        uploadedAt:
          type: string
          format: date-time

    # ── Customer satisfaction surveys (#994) ─────────────────────────────────

    Survey:
      type: object
      description: A customer satisfaction survey.
      required: [id, type, status, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [post_payment, post_support, periodic]
        status:
          type: string
          enum: [draft, sent, closed]
        meterId:
          type: string
          nullable: true
        customerEmail:
          type: string
          format: email
          nullable: true
        subject:
          type: string
          nullable: true
        questions:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
              kind:
                type: string
                enum: [nps, rating, free_text]
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SurveyResponse:
      type: object
      description: A single customer's answers to a survey.
      required: [id, surveyId, submittedAt]
      properties:
        id:
          type: string
        surveyId:
          type: string
        meterId:
          type: string
          nullable: true
        npsScore:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
          description: Net Promoter Score answer (0–10)
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        comment:
          type: string
          nullable: true
        answers:
          type: object
          additionalProperties: true
        submittedAt:
          type: string
          format: date-time

    NpsAnalytics:
      type: object
      description: Aggregated satisfaction and Net Promoter Score insights.
      required: [totalResponses, npsScore]
      properties:
        totalResponses:
          type: integer
        npsScore:
          type: number
          minimum: -100
          maximum: 100
          description: Percentage of promoters minus percentage of detractors
        promoters:
          type: integer
          description: Responses scoring 9–10
        passives:
          type: integer
          description: Responses scoring 7–8
        detractors:
          type: integer
          description: Responses scoring 0–6
        averageRating:
          type: number
          nullable: true
        responseRate:
          type: number
          nullable: true
          description: Responses divided by surveys sent
        periodStart:
          type: string
          format: date-time
          nullable: true
        periodEnd:
          type: string
          format: date-time
          nullable: true
        trend:
          type: array
          items:
            type: object
            properties:
              period: { type: string }
              npsScore: { type: number }
              responses: { type: integer }

    # ── Seasonal pricing (#992) ──────────────────────────────────────────────

    SeasonalRate:
      type: object
      description: A seasonal rate multiplier applied to the base energy price.
      required: [season, startDate, endDate, multiplier]
      properties:
        season:
          type: string
          enum: [spring, summer, autumn, winter]
        startDate:
          type: string
          format: date
          description: Inclusive start of the season (MM-DD or ISO date)
        endDate:
          type: string
          format: date
          description: Inclusive end of the season (MM-DD or ISO date)
        multiplier:
          type: number
          exclusiveMinimum: 0
          description: Rate multiplier applied to the base price (1.0 = no change)
        label:
          type: string
          nullable: true

    SeasonalRateHistoryEntry:
      type: object
      required: [season, multiplier, appliedAt]
      properties:
        season:
          type: string
          enum: [spring, summer, autumn, winter]
        multiplier:
          type: number
        appliedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

  # ── Shared response components ──────────────────────────────────────────────

  responses:
    TxHash:
      description: On-chain transaction hash
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TxHash"

    Unauthorized:
      description: Missing or invalid X-Admin-Key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Request body validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string }
              details: { type: object }

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# ── Paths ─────────────────────────────────────────────────────────────────────

paths:

  # ── Health ──────────────────────────────────────────────────────────────────

  /health:
    get:
      summary: Service health check
      description: >
        Returns the health of the Stellar RPC and MQTT broker connections.
        Also surfaces the current count of dead-lettered usage events.
      operationId: getHealth
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                  deadLetterEvents:
                    type: integer
        "503":
          description: One or more services degraded

  # ── Stats ────────────────────────────────────────────────────────────────────

  /api/stats:
    get:
      summary: Contract-derived meter statistics
      description: |
        Queries the Soroban contract for a real-time aggregate of all meters:
        total count, active count, total units consumed, and provider revenue.

        Response is cached for **30 seconds** to reduce RPC load.
      operationId: getStats
      responses:
        "200":
          description: Meter statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractStats"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/stats/summary:
    get:
      summary: Prom-client metrics snapshot
      description: |
        Returns a JSON snapshot of the four core prom-client counters/gauges
        for the admin dashboard.  Does **not** require Prometheus or Grafana
        to be running.

        Response is cached for **15 seconds**.
      operationId: getStatsSummary
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Provider ─────────────────────────────────────────────────────────────────

  /api/provider:
    get:
      summary: Provider revenue and meter summary
      description: |
        Returns the energy provider's on-chain revenue alongside an aggregate
        summary of all meters.  Requires admin authentication.

        Response is cached for **30 seconds**.
      operationId: getProvider
      security:
        - AdminKey: []
      responses:
        "200":
          description: Provider summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/provider/webhook:
    post:
      summary: Register provider low-balance webhook
      description: |
        Register or replace the webhook URL that receives low-balance
        notifications when a meter's balance drops below `LOW_BALANCE_THRESHOLD`.

        Alias for `POST /api/webhooks/low-balance` in the provider-facing
        namespace.  Requires admin authentication.
      operationId: registerProviderWebhook
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_url]
              properties:
                webhook_url:
                  type: string
                  format: uri
                  example: "https://provider.example.com/hooks/low-balance"
      responses:
        "200":
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  webhook_url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Meters ────────────────────────────────────────────────────────────────────

  /api/meters:
    get:
      summary: List all meters (paginated, filterable)
      operationId: listMeters
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
        - name: owner
          in: query
          description: Filter to meters belonging to a specific owner address
          schema: { type: string }
        - name: active
          in: query
          description: Filter by activation status
          schema: { type: string, enum: ["true", "false"] }
        - name: plan
          in: query
          description: Filter by payment plan
          schema: { type: string, enum: [daily, weekly, usage_based] }
        - name: expiresBefore
          in: query
          description: Filter meters whose expires_at is before this ISO 8601 timestamp
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated meter list
          content:
            application/json:
              schema:
                type: object
                properties:
                  meters:
                    type: array
                    items: {}
                  pagination:
                    type: object
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Register a new meter (admin only)
      operationId: registerMeter
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meter_id, owner]
              properties:
                meter_id:
                  type: string
                  maxLength: 12
                owner:
                  type: string
                  description: Stellar account address (G…)
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/meters/bulk:
    post:
      summary: Bulk meter status query
      description: >-
        Batch alternative to calling GET /api/meters/{id}/status once per
        meter. Capped at 100 meter_ids per request.
      operationId: getMeterStatusBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meter_ids]
              properties:
                meter_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        "200":
          description: Per-meter status, with per-meter errors reported separately
          content:
            application/json:
              schema:
                type: object
                properties:
                  meters:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        balance: { type: string }
                        active: { type: boolean }
                  errors:
                    type: object
                    additionalProperties: { type: string }
                  count: { type: integer }
                  requested: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/meters/{meterId}/forecast:
    get:
      summary: 7-day weather-based usage and solar generation forecast
      description: |
        Returns a 7-day forecast of energy consumption and solar generation
        based on upcoming weather conditions (temperature and sunlight).
        Includes confidence bands and an alert if the meter is predicted to
        run out of credit. (#982)
      operationId: getMeterForecast
      tags: [meters]
      parameters:
        - name: meterId
          in: path
          required: true
          schema: { type: string }
        - name: days
          in: query
          description: Forecast horizon in days (default 7).
          schema: { type: integer, minimum: 1, maximum: 7, default: 7 }
      responses:
        "200":
          description: 7-day forecast with confidence bands and credit alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterForecast"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Weather provider did not return a usable forecast.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/meters/{meterId}/appliances:
    get:
      summary: Appliance-level energy usage breakdown
      description: |
        Returns per-appliance energy consumption identified via ML
        disaggregation or sub-metering, including usage trends and
        energy-saving recommendations. (#983)
      operationId: getMeterAppliances
      tags: [meters]
      parameters:
        - name: meterId
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: query
          description: Aggregation period for the breakdown.
          schema: { type: string, enum: [day, week, month], default: week }
      responses:
        "200":
          description: Appliance usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplianceBreakdown"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/meters/{meterId}/diagnostics:
    post:
      summary: Trigger a remote meter diagnostic command
      description: |
        Sends a diagnostic command to the meter over the network. The meter
        reports results via MQTT, which are retrievable from the diagnostic
        logs endpoint. (#993)
      operationId: runMeterDiagnostics
      tags: [meters]
      security:
        - AdminKey: []
      parameters:
        - name: meterId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [reboot, self_test, check_connectivity]
      responses:
        "202":
          description: Diagnostic command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticLog"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/meters/{meterId}/diagnostic-logs:
    get:
      summary: Retrieve diagnostic logs for a meter
      description: |
        Returns the history of remote diagnostic commands and their results,
        including suggested fixes for common issue patterns. (#993)
      operationId: getMeterDiagnosticLogs
      tags: [meters]
      parameters:
        - name: meterId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated diagnostic logs
          content:
            application/json:
              schema:
                type: object
                required: [logs, page, pageSize, total, hasMore]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiagnosticLog"
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/meters/{id}/balance:
    get:
      summary: Live meter balance
      description: Response is cached for 5 seconds.
      operationId: getMeterBalance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Balance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterBalance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/meters/{id}/deactivate:
    post:
      summary: Admin deactivate a meter
      operationId: deactivateMeter
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/meters/{id}/activate:
    post:
      summary: Admin activate a meter
      operationId: activateMeter
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/meters/{meterId}/exports:
    get:
      summary: Grid export history for a meter (Issue #990)
      description: |
        Returns paginated grid export records for a meter, including the kWh
        exported, the credit earned, the applied export rate, and the on-chain
        settlement transaction hash.  Also returns import/export totals for the
        meter so the frontend can render an import/export breakdown.
      operationId: getMeterExports
      parameters:
        - name: meterId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: Exports per page (default 20, max 100)
      responses:
        "200":
          description: Paginated grid export history with import/export totals
          content:
            application/json:
              schema:
                type: object
                required: [exports, page, pageSize, total, hasMore, totals]
                properties:
                  exports:
                    type: array
                    items:
                      type: object
                      required: [id, meter_id, kwh, credit, rate, received_at, on_chain_tx_hash]
                      properties:
                        id: { type: integer }
                        meter_id: { type: string }
                        kwh: { type: number, description: Energy exported to the grid in kWh }
                        credit: { type: string, description: Credit earned in stroops (decimal string) }
                        rate: { type: string, description: Export rate applied, in stroops per kWh }
                        received_at: { type: string, format: date-time }
                        on_chain_tx_hash: { type: string, nullable: true }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }
                  totals:
                    type: object
                    required: [importKwh, exportKwh, exportCredit]
                    properties:
                      importKwh: { type: number, description: Total energy imported by the meter in kWh }
                      exportKwh: { type: number, description: Total energy exported by the meter in kWh }
                      exportCredit: { type: string, description: Total export credit earned in stroops (decimal string) }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/meters/{id}/history:
    get:
      summary: Paginated local usage history for a meter
      operationId: getMeterHistory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: Page number (1-based)
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: Events per page (default 20, max 100)
      responses:
        "200":
          description: Usage history
          content:
            application/json:
              schema:
                type: object
                required: [events, page, pageSize, total, hasMore]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/UsageEvent"
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/meters/{meterId}/power-quality:
    get:
      summary: Get power quality metrics for a meter
      description: |
        Returns the latest voltage, frequency, and THD readings for a meter,
        any detected quality issues (sags, swells, harmonics), a historical
        trend over the requested window, and the configured thresholds (#988).
      operationId: getMeterPowerQuality
      parameters:
        - name: meterId
          in: path
          required: true
          schema: { type: string }
        - name: days
          in: query
          description: Number of days of history to include (default 7)
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Power quality state and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerQualityResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Ingest a power quality sample for a meter (admin only)
      description: |
        Records a voltage/frequency/THD sample reported by an IoT power quality
        sensor. The backend evaluates the sample against configured thresholds
        and raises alerts when quality drops below acceptable levels (#988).
      operationId: ingestMeterPowerQuality
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerQualitySample"
      responses:
        "200":
          description: Sample recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerQualityResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/meters/{id}/notes:
    get:
      summary: List all notes for a meter
      operationId: getMeterNotes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated notes list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterNoteList"
    post:
      summary: Create a note for a meter (admin only)
      operationId: createMeterNote
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterNote"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/meters/{id}/notes/{noteId}:
    delete:
      summary: Delete a meter note (admin only)
      operationId: deleteMeterNote
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Note deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  noteId: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Webhooks ──────────────────────────────────────────────────────────────────

  /api/webhooks:
    get:
      summary: List all registered webhooks (admin only)
      description: |
        Returns all registered webhooks with audit fields: id, provider_id, url,
        created_at, last_triggered_at, and failure_count. Requires admin authentication.
      operationId: listWebhooks
      security:
        - AdminKey: []
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, count]
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookRecord"
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/webhooks/{id}/deliveries:
    get:
      summary: Last 50 delivery attempts for a webhook
      operationId: getWebhookDeliveries
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Delivery history
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, count]
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
                  count:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/webhooks/low-balance:
    post:
      summary: Register low-balance webhook URL
      description: |
        Register a webhook URL to receive `low_balance` notifications.
        Multiple URLs may be registered; all receive the notification.
      operationId: registerLowBalanceWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_url]
              properties:
                webhook_url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Webhook registered
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/webhooks/sms-payment:
    post:
      summary: Telecom partner SMS payment webhook
      description: |
        Receives a signed payment event from a telecom partner and triggers
        `make_payment` on-chain.  Requires a valid `X-Webhook-Signature` header
        (HMAC-SHA256 of the raw request body using `TELECOM_WEBHOOK_SECRET`).
      operationId: handleSmsPaymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meter_id, amount_xlm]
              properties:
                meter_id: { type: string }
                amount_xlm: { type: number }
                plan:
                  type: string
                  enum: [Daily, Weekly, Usage, UsageBased]
                  default: Daily
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "401":
          description: Invalid webhook signature

  # ── Allowlist ─────────────────────────────────────────────────────────────────

  /api/allowlist:
    get:
      summary: Get all allowlisted addresses
      operationId: getAllowlist
      responses:
        "200":
          description: List of allowlisted Stellar addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items: { type: string }
    post:
      summary: Add address to allowlist (admin only)
      operationId: addToAllowlist
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  description: 56-character Stellar address
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/allowlist/{address}:
    delete:
      summary: Remove address from allowlist (admin only)
      operationId: removeFromAllowlist
      security:
        - AdminKey: []
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Collaborators ─────────────────────────────────────────────────────────────

  /api/collaborators:
    get:
      summary: List all collaborators and their revenue shares
      operationId: getCollaborators
      responses:
        "200":
          description: Collaborator list
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborators:
                    type: array
                    items:
                      $ref: "#/components/schemas/CollaboratorShare"
    post:
      summary: Add collaborator (admin only)
      operationId: addCollaborator
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, basis_points]
              properties:
                address:
                  type: string
                  description: Stellar account address
                basis_points:
                  type: integer
                  description: Revenue share in basis points
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/collaborators/{address}:
    delete:
      summary: Remove collaborator (admin only)
      operationId: removeCollaborator
      security:
        - AdminKey: []
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/TxHash"
        "400":
          description: Invalid Stellar address
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Delegates ─────────────────────────────────────────────────────────────────

  /api/delegates/add:
    post:
      summary: Add a delegate who can make payments on behalf of meter owner
      description: |
        Authorize a delegate address to make payments for a specific meter. The meter
        owner retains full control and can revoke delegation at any time. Multiple
        delegates can be authorized per meter.
      operationId: addDelegate
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meterId, delegate, owner]
              properties:
                meterId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The meter ID to authorize delegate for
                delegate:
                  type: string
                  minLength: 56
                  maxLength: 56
                  description: Stellar address (G…) of the delegate to authorize
                owner:
                  type: string
                  minLength: 56
                  maxLength: 56
                  description: Stellar address (G…) of the meter owner
      responses:
        "200":
          description: Delegate added successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, hash, meterId, delegate]
                properties:
                  success:
                    type: boolean
                  hash:
                    type: string
                    description: Transaction hash
                  meterId:
                    type: string
                  delegate:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Contract error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string

  /api/delegates/remove:
    post:
      summary: Remove a delegate's authorization to make payments
      description: |
        Revoke a delegate's authorization to make payments for a specific meter.
        Only the meter owner can remove delegates.
      operationId: removeDelegate
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meterId, delegate, owner]
              properties:
                meterId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The meter ID to remove delegate from
                delegate:
                  type: string
                  minLength: 56
                  maxLength: 56
                  description: Stellar address (G…) of the delegate to remove
                owner:
                  type: string
                  minLength: 56
                  maxLength: 56
                  description: Stellar address (G…) of the meter owner
      responses:
        "200":
          description: Delegate removed successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, hash, meterId, delegate]
                properties:
                  success:
                    type: boolean
                  hash:
                    type: string
                    description: Transaction hash
                  meterId:
                    type: string
                  delegate:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Contract error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string

  /api/delegates/{meterId}:
    get:
      summary: Get all delegates authorized to make payments for a meter
      description: |
        Returns a list of all delegate addresses authorized to make payments on
        behalf of the meter owner. Public read access.
      operationId: getDelegates
      parameters:
        - name: meterId
          in: path
          required: true
          schema:
            type: string
          description: The meter ID to query delegates for
      responses:
        "200":
          description: Delegate list
          content:
            application/json:
              schema:
                type: object
                required: [meterId, delegates, count]
                properties:
                  meterId:
                    type: string
                  delegates:
                    type: array
                    items:
                      type: string
                      description: Stellar address (G…)
                  count:
                    type: integer
                    description: Number of authorized delegates
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          description: Contract error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string

  /api/delegates/payment:
    post:
      summary: Make a payment on behalf of a meter owner as an authorized delegate
      description: |
        Allows an authorized delegate to make a payment for a meter without
        transferring ownership. The delegate must have been previously authorized
        via `POST /api/delegates/add`.
        
        **Use cases:**
        - Parents paying for adult children's energy
        - Employers subsidizing worker housing
        - Property managers paying for rental units
        - Energy provider incentive programs
      operationId: makeDelegatedPayment
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meterId, delegate, amount]
              properties:
                meterId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The meter ID to pay for
                delegate:
                  type: string
                  minLength: 56
                  maxLength: 56
                  description: Stellar address (G…) of the authorized delegate
                amount:
                  type: integer
                  minimum: 1
                  description: Payment amount in stroops (1 XLM = 10^7 stroops)
                plan:
                  type: string
                  enum: [Daily, Weekly, UsageBased]
                  default: Daily
                  description: Payment plan type
                memo:
                  type: string
                  maxLength: 100
                  description: Optional payment memo
      responses:
        "200":
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                required: [success, hash, meterId, delegate, amount, plan]
                properties:
                  success:
                    type: boolean
                  hash:
                    type: string
                    description: Transaction hash
                  meterId:
                    type: string
                  delegate:
                    type: string
                  amount:
                    type: integer
                  plan:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Contract error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string

  # ── Installments ─────────────────────────────────────────────────────────────

  /api/payments/installments:
    post:
      summary: Create an installment payment plan (admin only)
      description: |
        Creates a new installment plan for a meter purchase or upgrade. The
        total amount is split into the requested number of installments, and
        deductions are scheduled automatically from the payer's balance.
      operationId: createInstallmentPlan
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstallmentPlanRequest"
      responses:
        "201":
          description: Installment plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlan"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/payments/installments/{planId}:
    get:
      summary: Get an installment plan by id
      operationId: getInstallmentPlan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Installment plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/payments/installments/payer/{address}:
    get:
      summary: List installment plans for a payer
      operationId: getInstallmentPlansByPayer
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string }
          description: Stellar account address of the payer
      responses:
        "200":
          description: Installment plans for the payer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlanList"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/payments/installments/{planId}/pay:
    post:
      summary: Make a payment toward an installment plan (admin only)
      description: |
        Charges the payer's balance for the next installment. When `amount` is
        omitted the scheduled installment amount is used. Emits an
        `InstallmentPaid` event on success.
      operationId: payInstallment
      security:
        - AdminKey: []
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayInstallmentRequest"
      responses:
        "200":
          description: Installment paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPlan"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/payments/installments/process-due:
    post:
      summary: Process all due installments (admin only)
      description: |
        Runs the automatic deduction sweep: charges every plan whose `nextDue`
        has passed, and marks plans as defaulted when the grace period has
        elapsed without a successful payment. Emits `InstallmentPaid` and
        `InstallmentDefaulted` events.
      operationId: processDueInstallments
      security:
        - AdminKey: []
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDueInstallmentsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Usage Events ─────────────────────────────────────────────────────────────

  /api/usage-events:
    delete:
      summary: Purge submitted usage events older than N days (admin only)
      description: |
        Hard-deletes usage events with `status = submitted` older than `olderThanDays` days.
        Defaults to 90 days. Only submitted events are deleted — pending and failed events
        are never purged.
      operationId: purgeUsageEvents
      security:
        - AdminKey: []
      parameters:
        - name: olderThanDays
          in: query
          schema: { type: integer, default: 90, minimum: 0 }
      responses:
        "200":
          description: Deleted count
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/usage-events/failed:
    get:
      summary: List dead-lettered usage events (admin only)
      description: |
        Returns events with `status = failed` (exhausted all retry attempts) with pagination.
      operationId: getFailedUsageEvents
      security:
        - AdminKey: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, maximum: 100 }
      responses:
        "200":
          description: Paginated failed events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/UsageEvent"
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      pages: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/usage-events/{id}/replay:
    post:
      summary: Replay a failed usage event (admin only)
      description: |
        Resets a failed event back to `pending` with `attempt_count = 0` so
        the retry worker picks it up on its next tick.
      operationId: replayUsageEvent
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated event record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEvent"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Admin: Dead-letter ────────────────────────────────────────────────────────

  /api/admin/dead-letters:
    get:
      summary: List dead-lettered usage events (admin only)
      description: |
        Returns usage events that have been dead-lettered after exhausting all
        retry attempts (`MAX_RETRY_ATTEMPTS`, default 5).

        These events were not submitted on-chain and require manual review or
        reprocessing via `POST /api/admin/dead-letters/{id}/reprocess`.
      operationId: getDeadLetters
      security:
        - AdminKey: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Dead-letter event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/dead-letters/{id}/reprocess:
    post:
      summary: Requeue a dead-lettered event (admin only)
      description: |
        Resets the event status to `pending` and zeroes the attempt counter so
        the retry worker picks it up on its next tick.
      operationId: reprocessDeadLetter
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  event:
                    $ref: "#/components/schemas/UsageEvent"
        "400":
          description: Invalid event id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Event not found or not in dead-letter state

  # ── Voice Assistant ───────────────────────────────────────────────────────────

  /api/voice/parse:
    post:
      summary: Parse a natural-language voice utterance
      description: |
        Interprets an Alexa or Google Assistant utterance and returns the
        recognised intent, extracted slots, confidence and locale.  Used by the
        voice skills to resolve commands such as "check my balance",
        "how much energy have I used" and "pay 5 XLM on meter MTR-001".
      operationId: parseVoiceUtterance
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceParseRequest"
      responses:
        "200":
          description: Parsed intent and slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceParseResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/voice/payment/confirm:
    post:
      summary: Confirm a pending voice-initiated payment
      description: |
        Executes a payment previously proposed by the voice assistant after the
        user has verbally confirmed it.  Requires the one-time confirmation code
        issued during the proposal step.
      operationId: confirmVoicePayment
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoicePaymentConfirmRequest"
      responses:
        "200":
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicePaymentConfirmResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/voice/payment/cancel:
    post:
      summary: Cancel a pending voice-initiated payment
      description: |
        Discards a payment proposal created by the voice assistant so it can no
        longer be confirmed.  Safe to call when no proposal is pending.
      operationId: cancelVoicePayment
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meterId]
              properties:
                meterId:
                  type: string
                  maxLength: 64
                sessionId:
                  type: string
      responses:
        "200":
          description: Proposal cancelled
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean }
                  meterId: { type: string }
                  speech: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Metrics ───────────────────────────────────────────────────────────────────

  /api/metrics/summary:
    get:
      summary: JSON metrics snapshot for admin dashboard
      description: |
        Returns a JSON snapshot of core prom-client counters/gauges.  Does not
        require Prometheus or Grafana to be running.  Cached for 15 seconds.

        Note: `/api/stats/summary` provides the same payload — this endpoint
        is kept for backwards compatibility.
      operationId: getMetricsSummary
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"

  /metrics:
    get:
      summary: Prometheus scrape endpoint (text format)
      description: Standard Prometheus exposition format for scraping.
      operationId: getPrometheusMetrics
      responses:
        "200":
          description: Prometheus metrics text

  # ── Maintenance ───────────────────────────────────────────────────────────────

  /api/maintenance:
    post:
      summary: Create a scheduled maintenance window (admin only)
      description: |
        Schedules a maintenance window and records the meters it affects.
        Notification emails are dispatched automatically 48 hours, 24 hours,
        and 1 hour before `scheduledStart`.
      operationId: createMaintenanceWindow
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceWindowRequest"
      responses:
        "201":
          description: Maintenance window created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindow"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/maintenance/upcoming:
    get:
      summary: List scheduled maintenance windows
      description: >
        Returns maintenance windows whose `scheduledEnd` is in the future,
        ordered by `scheduledStart` ascending.
      operationId: getUpcomingMaintenance
      responses:
        "200":
          description: Upcoming maintenance windows
          content:
            application/json:
              schema:
                type: object
                required: [windows, count]
                properties:
                  windows:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaintenanceWindow"
                  count:
                    type: integer

  /api/maintenance/active:
    get:
      summary: Get the currently active maintenance window
      description: >
        Returns the maintenance window covering the current time, or `null`
        when no maintenance is in progress. Used by the frontend to render
        the maintenance banner.
      operationId: getActiveMaintenance
      responses:
        "200":
          description: Active maintenance window or null
          content:
            application/json:
              schema:
                type: object
                required: [window]
                properties:
                  window:
                    oneOf:
                      - $ref: "#/components/schemas/MaintenanceWindow"
                      - type: "null"

  /api/maintenance/{id}:
    get:
      summary: Get a maintenance window by id
      operationId: getMaintenanceWindow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Maintenance window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindow"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Cancel a maintenance window (admin only)
      operationId: deleteMaintenanceWindow
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Maintenance window cancelled
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted: { type: boolean }
                  id: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Solar ─────────────────────────────────────────────────────────────────────

  /api/solar/forecast:
=======
  # ── Solar ─────────────────────────────────────────────────────────────────────

  /api/solar/forecast:
    get:
      summary: Estimate solar energy production and revenue
      description: |
        Returns per-period (daily/weekly/monthly/yearly) kWh production estimates
        and revenue projections for a given panel setup. All calculations are
        server-side; no external data sources are used.
      operationId: getSolarForecast
      tags: [solar]
      parameters:
        - name: capacityKw
          in: query
          required: true
          description: Total panel capacity in kilowatts (e.g. 5)
          schema: { type: number, exclusiveMinimum: 0, maximum: 10000 }
        - name: peakSunHours
          in: query
          required: true
          description: Average daily peak sun hours for the location
          schema: { type: number, exclusiveMinimum: 0, maximum: 24 }
        - name: efficiency
          in: query
          description: Panel efficiency 0–1 (default 0.20)
          schema: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.20 }
        - name: panelAgeYears
          in: query
          description: Age of panels in years for degradation calculation (default 0)
          schema: { type: number, minimum: 0, default: 0 }
        - name: ratePerKwh
          in: query
          description: Local electricity rate in XLM/kWh (default 0.12)
          schema: { type: number, minimum: 0, default: 0.12 }
      responses:
        "200":
          description: Solar production forecast
          content:
            application/json:
              schema:
                type: object
                required: [panelCapacityKw, peakSunHours, efficiency, panelAgeYears, effectiveDegradation, dailyKwh, forecast, assumptions]
                properties:
                  panelCapacityKw: { type: number }
                  peakSunHours: { type: number }
                  efficiency: { type: number }
                  panelAgeYears: { type: number }
                  effectiveDegradation: { type: number }
                  dailyKwh: { type: number }
                  forecast:
                    type: array
                    items:
                      type: object
                      required: [period, days, estimatedKwh, estimatedRevenue]
                      properties:
                        period: { type: string }
                        days: { type: integer }
                        estimatedKwh: { type: number }
                        estimatedRevenue: { type: number }
                  assumptions:
                    type: object
                    properties:
                      systemLoss: { type: number }
                      degradationRatePerYear: { type: number }
                      ratePerKwh: { type: number }
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/solar/irradiance-zones:
    get:
      summary: Reference peak sun hours by climate zone
      description: |
        Returns a static list of common climate zones with their reference peak
        sun-hour values. Useful for populating dropdowns on the frontend.
      operationId: getSolarIrradianceZones
      tags: [solar]
      responses:
        "200":
          description: Irradiance zone list
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items:
                      type: object
                      required: [name, peakSunHours]
                      properties:
                        name: { type: string }
                        peakSunHours: { type: number }

  # ── Work Orders (technician portal, #991) ────────────────────────────────────

  /api/work-orders:
    post:
      summary: Create a work order
      description: |
        Creates an installation, maintenance, repair, or inspection work order.
        Optionally assigns it to a technician immediately.
      operationId: createWorkOrder
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [installation, maintenance, repair, inspection]
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                  default: normal
                meterId: { type: string }
                customerName: { type: string }
                address: { type: string }
                description: { type: string }
                technicianId: { type: string }
                scheduledFor: { type: string, format: date-time }
      responses:
        "201":
          description: Work order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/work-orders/assigned/{techId}:
    get:
      summary: List a technician's assigned tasks
      description: Returns all work orders assigned to the given technician.
      operationId: getAssignedWorkOrders
      parameters:
        - name: techId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          description: Filter by work order status
          schema:
            type: string
            enum: [pending, assigned, in_progress, completed, cancelled]
      responses:
        "200":
          description: Assigned work orders
          content:
            application/json:
              schema:
                type: object
                required: [workOrders, count]
                properties:
                  workOrders:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkOrder"
                  count: { type: integer }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/work-orders/{id}/complete:
    patch:
      summary: Mark a work order complete
      description: |
        Marks the work order as completed, records the completion timestamp and
        optional notes, and stores any verification photos already uploaded.
      operationId: completeWorkOrder
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                completionNotes: { type: string }
                photos:
                  type: array
                  items: { type: string, format: uri }
      responses:
        "200":
          description: Work order completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/work-orders/{id}/photos:
    post:
      summary: Upload installation verification photos
      description: |
        Attaches one or more verification photos to a work order. Photos are
        submitted as URLs (e.g. after direct upload to object storage).
      operationId: uploadWorkOrderPhotos
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/WorkOrderPhoto"
      responses:
        "201":
          description: Photos attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Surveys (#994) ───────────────────────────────────────────────────────────

  /api/surveys:
    post:
      summary: Create a customer satisfaction survey
      description: |
        Creates a survey and, when `send` is true, queues the survey email to
        the customer. Surveys can also be created automatically after payments
        or support interactions.
      operationId: createSurvey
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [post_payment, post_support, periodic]
                meterId: { type: string }
                customerEmail: { type: string, format: email }
                subject: { type: string }
                send:
                  type: boolean
                  default: false
                questions:
                  type: array
                  items:
                    type: object
                    required: [id, text]
                    properties:
                      id: { type: string }
                      text: { type: string }
                      kind:
                        type: string
                        enum: [nps, rating, free_text]
      responses:
        "201":
          description: Survey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/surveys/{id}/responses:
    post:
      summary: Record a survey response
      description: Records a customer's answers, including an optional NPS score.
      operationId: createSurveyResponse
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                npsScore:
                  type: integer
                  minimum: 0
                  maximum: 10
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment: { type: string }
                answers:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/surveys/analytics:
    get:
      summary: Satisfaction and NPS analytics
      description: |
        Returns aggregated satisfaction metrics, including the Net Promoter
        Score, promoter/passive/detractor counts, and an optional trend series.
      operationId: getSurveyAnalytics
      security:
        - AdminKey: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: type
          in: query
          schema:
            type: string
            enum: [post_payment, post_support, periodic]
      responses:
        "200":
          description: Survey analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NpsAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Seasonal pricing (#992) ──────────────────────────────────────────────────

  /api/pricing/season:
    get:
      summary: Current seasonal rate
      description: |
        Returns the seasonal rate currently in effect based on the current date,
        along with the effective price after applying the multiplier.
      operationId: getCurrentSeason
      responses:
        "200":
          description: Current season and rate
          content:
            application/json:
              schema:
                type: object
                required: [current, baseRate, effectiveRate]
                properties:
                  current:
                    $ref: "#/components/schemas/SeasonalRate"
                  baseRate:
                    type: number
                    description: Base energy rate before the seasonal multiplier
                  effectiveRate:
                    type: number
                    description: Base rate multiplied by the current seasonal multiplier
        "500":
          $ref: "#/components/responses/InternalError"

  /api/pricing/season/history:
    get:
      summary: Historical seasonal rate comparison
      description: |
        Returns the seasonal rates that have applied over time so customers can
        compare current pricing against previous seasons.
      operationId: getSeasonalRateHistory
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Seasonal rate history
          content:
            application/json:
              schema:
                type: object
                required: [history, count]
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeasonalRateHistoryEntry"
                  count: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/weather/energy-forecast:
    get:
      summary: Forecast hourly energy production and consumption
      description: |
        Returns up to 48 hourly forecasts using a seasonal regression trained
        on the preceding 90 days of meter usage and/or registered solar-panel
        telemetry. OpenWeather hourly conditions are used to adjust estimates.
        Accuracy is measured on held-out history and is null when unavailable.
      operationId: getHourlyEnergyForecast
      tags: [weather]
      parameters:
        - name: meterId
          in: query
          description: Meter whose historical milli-kWh usage should be forecast.
          schema: { type: string, maxLength: 64 }
        - name: deviceId
          in: query
          description: Registered solar_panel device whose production should be forecast.
          schema: { type: string, maxLength: 100 }
        - name: lat
          in: query
          description: Latitude; required unless supplied by the registered solar device.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          description: Longitude; required unless supplied by the registered solar device.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: hours
          in: query
          description: Forecast horizon in whole hours (default 48).
          schema: { type: integer, minimum: 1, maximum: 48, default: 48 }
      responses:
        "200":
          description: Hourly forecast and per-model holdout accuracy.
          content:
            application/json:
              schema:
                type: object
                required: [horizonHours, generatedAt, location, weatherStale, models, forecast]
                properties:
                  meterId: { type: [string, "null"] }
                  deviceId: { type: [string, "null"] }
                  horizonHours: { type: integer, minimum: 1, maximum: 48 }
                  generatedAt: { type: string, format: date-time }
                  weatherStale: { type: boolean }
                  models:
                    type: object
                    properties:
                      production: { $ref: "#/components/schemas/EnergyForecastModel" }
                      consumption: { $ref: "#/components/schemas/EnergyForecastModel" }
                  forecast:
                    type: array
                    items:
                      type: object
                      required: [timestamp, productionKwh, consumptionKwh, weather]
                      properties:
                        timestamp: { type: string, format: date-time }
                        productionKwh: { type: [number, "null"] }
                        consumptionKwh: { type: [number, "null"] }
                        weather:
                          type: object
                          properties:
                            temperatureC: { type: number }
                            cloudCoverPct: { type: number }
                            precipitationProbability: { type: number }
                            condition: { type: string }
                            productionFactor: { type: number }
                            consumptionTemperatureFactor: { type: number }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Weather provider did not return a usable 48-hour forecast.
