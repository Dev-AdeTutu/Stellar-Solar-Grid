[package]
name = "multisig_wallet"
version = "0.1.0"
edition = "2021"
description = "N-of-M ed25519 custom account for organizational SolarGrid wallets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=27.0.2" }

[dev-dependencies]
soroban-sdk = { version = "=27.0.2", features = ["testutils"] }
ed25519-dalek = "2.2"
solar_grid = { path = "../solar_grid" }

[features]
testutils = ["soroban-sdk/testutils"]
