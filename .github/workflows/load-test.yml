name: Load Test

on:
  pull_request:
    paths: ['backend/**']

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Generate throwaway CI credentials
        id: creds
        run: |
          node --input-type=module -e "
            import { Keypair, StrKey } from '@stellar/stellar-sdk';
            import { randomBytes } from 'node:crypto';
            import { appendFileSync } from 'node:fs';
            const secret = Keypair.random().secret();
            const contractId = StrKey.encodeContract(randomBytes(32));
            appendFileSync(process.env.GITHUB_ENV, \`ADMIN_SECRET_KEY=\${secret}\n\`);
            appendFileSync(process.env.GITHUB_ENV, \`CONTRACT_ID=\${contractId}\n\`);
          "

      - name: Start backend
        run: |
          node dist/index.js > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || true)
            # 503 (degraded deps, e.g. no real MQTT broker in CI) still means
            # the server itself is up and responding.
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Backend is up (status $code)"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start" && cat backend.log && exit 1
        env:
          PORT: 3001
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          MQTT_BROKER: mqtt://localhost:1883
          FRONTEND_ORIGIN: http://localhost:5173
          # No proxy in front of this throwaway CI instance.
          TRUST_PROXY_HOPS: 0

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: backend/loadtest/critical-endpoints.js
        env:
          BASE_URL: http://localhost:3001

      - name: Backend logs
        if: always()
        run: cat backend.log || true

      - name: Stop backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true
